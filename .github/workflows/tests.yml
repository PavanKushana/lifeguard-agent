# tests.yml
# GitHub Actions: on every push, GitHub runs this on its own Linux machine (free for public repos).
# 1. pytest: all the tests that don't need AI.
# 2. docker: builds the image from the Dockerfile and checks the app really starts in it.
# The result is the green tick (or red cross) next to each commit on GitHub. Render waits for the
# green tick before it deploys (autoDeployTrigger: checksPass in render.yaml), so a broken commit
# never reaches the live demo.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab, to run it by hand

# ubuntu-24.04 instead of ubuntu-latest: "latest" moves to Ubuntu 26 from 19 Oct 2026. Like the pinned
# packages, the machine stays the one the tests passed on, and we choose when to move.
# checkout and setup-python v7: the current versions (24 Oct 2026), built on Node.js 24 (v4/v5 used
# Node.js 20, which GitHub warned about).
jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install the packages
        run: pip install -r requirements.txt
      - name: Run the tests
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t lifeguard-agent .
      # No API keys here on purpose: the app must start without them (it only needs them for AI calls).
      - name: Start it and wait for /health
        run: |
          docker run -d --name lifeguard-agent -p 8000:8000 lifeguard-agent
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs lifeguard-agent
          exit 1
      - name: The page and the API answer
        run: |
          curl -fsS http://localhost:8000/ | grep -q "Lifeguard-Agent"
          curl -fsS http://localhost:8000/status | grep -q "containers"
      - name: Docker's own health check says healthy
        run: |
          for i in $(seq 1 24); do
            status=$(docker inspect --format '{{.State.Health.Status}}' lifeguard-agent)
            echo "health: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          docker logs lifeguard-agent
          exit 1
