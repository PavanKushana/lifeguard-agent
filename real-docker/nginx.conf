# nginx.conf: the shop's front door. The home page comes from nginx itself; everything under /api/
# goes to the api container, like in the simulated shop.
server {
    listen 80;

    # Docker's own DNS. With the address in a variable, nginx looks the api up again every 5 seconds.
    # A fixed "proxy_pass http://api:8000" keeps the old address forever, so after a rollback (a new
    # api container, often with a new address) the shop would still show errors.
    resolver 127.0.0.11 valid=5s;
    set $api http://api:8000;

    location = / {
        default_type text/html;
        return 200 "<h1>Lifeguard demo shop</h1>";
    }

    location /api/ {
        proxy_pass $api;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
}
